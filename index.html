<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#102d25">
<title>Jungle Dash — Canopy Run</title>
<style>
:root{color-scheme:dark;--cream:#fff5da;--lime:#c8f05c;--coral:#ff765c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102d25;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--cream);touch-action:none}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-width:320px;min-height:240px;background:#1e513e;overflow:hidden;isolation:isolate;box-shadow:0 20px 90px #06120fc2}canvas{width:100%;height:100%;display:block}.brand{position:absolute;left:4.2%;top:5%;z-index:2;pointer-events:none;filter:drop-shadow(0 3px 4px #12382c66)}.eyebrow{font-size:clamp(8px,1vw,12px);letter-spacing:.24em;font-weight:900;color:#d9f596;text-transform:uppercase}.brand h1{font-size:clamp(20px,3vw,39px);line-height:.95;margin:7px 0 0;font-weight:1000;letter-spacing:-.06em;text-shadow:0 3px 0 #246249}.brand h1 span{color:#ffe28c}.hud{position:absolute;right:4%;top:5%;display:flex;gap:clamp(8px,2vw,24px);z-index:3;pointer-events:none}.stat{min-width:78px;text-align:right}.stat-label{display:block;color:#d4e9bb;font-size:clamp(8px,.9vw,11px);font-weight:900;letter-spacing:.17em}.stat b{display:block;font-size:clamp(16px,2.1vw,26px);line-height:1.15;text-shadow:0 2px 0 #164634}.berry{color:#ffe28c}.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:linear-gradient(90deg,#103329bb,#10332944 55%,#10332988);transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(440px,81%);padding:clamp(18px,3.2vw,34px);border:1px solid #e8f4b354;border-radius:22px;background:linear-gradient(145deg,#174a39f2,#12382ff2);box-shadow:0 18px 55px #071a16a1;text-align:center;backdrop-filter:blur(8px);transform:translateY(-1%)}.card .tag{font-size:clamp(8px,1vw,11px);letter-spacing:.22em;font-weight:1000;color:#d7f28d;text-transform:uppercase}.card h2{margin:9px 0 10px;font-size:clamp(24px,4vw,42px);line-height:.99;letter-spacing:-.055em}.card p{margin:0 auto 18px;color:#dfebd1;font-size:clamp(11px,1.35vw,15px);line-height:1.5;max-width:330px}.howto{display:flex;justify-content:center;gap:10px;margin:17px 0 20px}.hint{display:flex;gap:8px;align-items:center;text-align:left;background:#ffffff0d;border:1px solid #ffffff17;border-radius:12px;padding:9px 11px;font-size:clamp(9px,1.05vw,12px);color:#eaf1dd}.hint kbd{display:grid;place-items:center;width:27px;height:27px;flex:none;border-radius:8px;background:#d9ef9c;color:#21412f;font-weight:1000;font-size:15px;box-shadow:inset 0 -3px #a5cb67}.action{border:0;border-radius:999px;padding:13px 28px;background:linear-gradient(180deg,#e1f58d,#b8e754);color:#24412d;font:inherit;font-size:clamp(12px,1.4vw,16px);font-weight:1000;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 5px 0 #7baf39,0 10px 22px #091c1459;cursor:pointer;touch-action:manipulation}.action:active{transform:translateY(3px);box-shadow:0 2px 0 #7baf39}.subtle{margin-top:13px!important;margin-bottom:0!important;font-size:clamp(9px,1vw,11px)!important;color:#b8d2ba!important}.touch-controls{position:absolute;bottom:4%;left:0;right:0;display:none;justify-content:space-between;padding:0 5%;z-index:4;pointer-events:none}.touch-btn{width:54px;height:54px;border:1px solid #ffffff48;border-radius:50%;background:#143c31a8;color:#f8f6df;font-size:23px;display:grid;place-items:center;pointer-events:auto;touch-action:manipulation;backdrop-filter:blur(5px);box-shadow:0 5px 20px #071a1655}.touch-btn:active{background:#d7ef8e;color:#20422f;transform:scale(.94)}.sound{position:absolute;bottom:4%;right:4%;z-index:3;border:1px solid #ffffff47;background:#123d32a8;color:#fff4d9;border-radius:999px;padding:8px 12px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;touch-action:manipulation}.sound.hidden{display:none}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 85px #071a1740;pointer-events:none;z-index:1}@media(max-width:700px){.touch-controls{display:flex}.game{min-height:0}.brand{top:4%}.hud{top:4%}.stat{min-width:54px}.stat-label{letter-spacing:.1em}.card{width:min(410px,88%);padding:18px}.howto{margin:12px 0 16px}.touch-btn{width:48px;height:48px}}@media(orientation:portrait){.game{width:100vw;height:56.25vw;min-height:260px;max-height:100vh}.brand h1{font-size:21px}.hud{gap:7px}.stat{min-width:47px}.stat b{font-size:16px}.card{padding:17px 16px}.card h2{font-size:26px}}
</style>
</head>
<body>
<main class="game" aria-label="Jungle Dash endless runner game">
<canvas id="game" aria-label="Jungle runner. Swipe up to jump and swipe down to slide."></canvas>
<div class="brand"><div class="eyebrow">A canopy escape</div><h1>JUNGLE <span>DASH</span></h1></div>
<div class="hud"><div class="stat"><span class="stat-label">DISTANCE</span><b id="distance">0000 <small style="font-size:.55em">m</small></b></div><div class="stat"><span class="stat-label">BERRIES</span><b class="berry">● <span id="berries">0</span></b></div></div>
<div class="overlay" id="overlay"><section class="card"><div class="tag" id="tag">The monkeys are close!</div><h2 id="title">RUN, <span style="color:#ffc479">RUBY!</span></h2><p id="message">A mischievous monkey mob is right behind you. Dash through the jungle and see how far you can get!</p><div class="howto"><div class="hint"><kbd>↑</kbd><span>Jump<br>over rocks</span></div><div class="hint"><kbd>↓</kbd><span>Slide<br>under vines</span></div></div><button class="action" id="start">Start running</button><p class="subtle" id="subtle">Swipe or use ↑ / ↓ · Collect golden berries</p></section></div>
<div class="touch-controls"><button class="touch-btn" id="jump" aria-label="Jump">↑</button><button class="touch-btn" id="slide" aria-label="Slide">↓</button></div>
<button class="sound" id="sound" aria-label="Toggle sound">♪ Sound on</button><div class="vignette"></div>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),message=document.querySelector('#message'),tag=document.querySelector('#tag'),startBtn=document.querySelector('#start'),distanceEl=document.querySelector('#distance'),berriesEl=document.querySelector('#berries'),soundBtn=document.querySelector('#sound');
const W=960,H=540,ground=426;let state='ready',last=0,elapsed=0,world=0,speed=310,distance=0,berries=0,objects=[],particles=[],player={x:215,y:ground,vy:0,jump:0,slide:0,frame:0},monkeys=[];let audio=null,soundOn=true,spawnClock=0,berryClock=0,flash=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function rand(a,b){return a+Math.random()*(b-a)}function visual(a,b,k){let n=Math.sin(k*127.1+311.7)*43758.5453;return a+(n-Math.floor(n))*(b-a)}
function reset(){state='running';elapsed=0;world=0;speed=310;distance=0;berries=0;objects=[];particles=[];spawnClock=1.1;berryClock=2.2;flash=0;player={x:215,y:ground,vy:0,jump:0,slide:0,frame:0};monkeys=[{x:70,y:ground-52,s:1},{x:112,y:ground-38,s:.8},{x:30,y:ground-26,s:.66}];overlay.classList.add('hidden');last=performance.now();playTone(480,.08);requestAnimationFrame(loop)}
function action(type){if(state!=='running')return;if(type==='jump'&&player.jump<=0&&player.slide<=0){player.vy=-630;player.jump=.65;emit(player.x+30,ground-20,'#d7f29a',7);playTone(520,.07)}if(type==='slide'&&player.jump<=.03){player.slide=.72;playTone(330,.06)}}
function gameOver(){if(state!=='running')return;state='over';flash=.65;playTone(150,.3);tag.textContent='Caught by the cheekiest crew';title.innerHTML='OH NO, <span style="color:#ffc479">RUBY!</span>';message.innerHTML=`The monkeys caught up after <b style="color:#d9f596">${Math.floor(distance)} meters</b> and you collected <b style="color:#ffe28c">${berries} berries</b>. Ready for a rematch?`;startBtn.textContent='Run it back';document.querySelector('#subtle').textContent='Tip: jump over rocks · slide under hanging vines';setTimeout(()=>overlay.classList.remove('hidden'),420)}
function playTone(freq,dur){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function emit(x,y,color,n=5){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-160,20),life:rand(.35,.8),max:.8,color,r:rand(2,5)})}
function addObstacle(type,x=W+40){objects.push({type,x,y:type==='rock'?ground:rand(260,315),w:type==='rock'?rand(48,72):rand(80,115),h:type==='rock'?rand(28,48):28,passed:false})}
function addBerries(){let x=W+40,n=3+Math.floor(Math.random()*3),baseY=rand(300,365);for(let i=0;i<n;i++)objects.push({type:'berry',x:x+i*33,y:baseY-Math.sin(i/(n-1)*Math.PI)*32,w:20,h:20,passed:false})}
function loop(now){if(state!=='running')return;let dt=Math.min(.034,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){elapsed+=dt;world+=speed*dt;speed=Math.min(520,310+elapsed*5.2);distance+=speed*dt/11;distanceEl.innerHTML=`${String(Math.floor(distance)).padStart(4,'0')} <small style="font-size:.55em">m</small>`;spawnClock-=dt;berryClock-=dt;if(spawnClock<=0){addObstacle(Math.random()<.54?'rock':'vine');spawnClock=rand(.95,1.48)*Math.max(.7,1-(speed-310)/850)}if(berryClock<=0){addBerries();berryClock=rand(3.2,5.1)}
player.frame+=dt*(speed/45);if(player.jump>0){player.jump-=dt;player.vy+=1500*dt;player.y+=player.vy*dt;if(player.y>=ground){player.y=ground;player.vy=0;player.jump=0}}if(player.slide>0)player.slide-=dt;
for(const o of objects)o.x-=speed*dt;objects=objects.filter(o=>o.x>-150);for(const m of monkeys){m.x=68+Math.sin(elapsed*5+m.s)*6;m.y=ground-42+Math.sin(elapsed*8+m.s)*3}
const px=player.x,sliding=player.slide>0,py=player.y;for(const o of objects){if(o.type==='berry'){if(!o.passed&&Math.abs(o.x+o.w/2-(px+21))<34&&Math.abs(o.y-(py-55))<60){o.passed=true;berries++;berriesEl.textContent=berries;emit(o.x,o.y,'#ffe584',9);playTone(720,.09)}continue}let hit;if(o.type==='rock'){hit=px+43>o.x+7&&px+3<o.x+o.w-5&&py>ground-8}else{hit=!sliding&&px+39>o.x+7&&px+10<o.x+o.w-8&&py>ground-115}if(hit){gameOver();break}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function leaf(x,y,s,rot,color){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-s*.5,-s*.55,0,-s);ctx.quadraticCurveTo(s*.5,-s*.5,0,0);ctx.fill();ctx.strokeStyle='#c1dd8260';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(0,-s*.86);ctx.stroke();ctx.restore()}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#83bd8c');g.addColorStop(.48,'#bdd893');g.addColorStop(1,'#e5c779');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// sunlit canopy opening
let glow=ctx.createRadialGradient(590,210,10,590,210,330);glow.addColorStop(0,'#f8e9a47d');glow.addColorStop(1,'#f7dda000');ctx.fillStyle=glow;ctx.fillRect(180,0,650,420);
// distant foliage
for(let i=0;i<18;i++){let x=((i*103-world*.13)%1200+1200)%1200-120,y=visual(155,290,i+1);ctx.fillStyle=['#347455','#48805a','#5a925d'][i%3];ctx.beginPath();ctx.ellipse(x,y,visual(45,105,i+21),visual(95,180,i+41),visual(-.4,.4,i+61),0,Math.PI*2);ctx.fill()}
// trunks
for(let i=0;i<7;i++){let x=((i*205-world*.27)%1250+1250)%1250-130;ctx.fillStyle='#755b3c';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+62,0);ctx.lineTo(x+46,ground);ctx.lineTo(x-25,ground);ctx.fill();ctx.fillStyle='#92744a';ctx.beginPath();ctx.moveTo(x+12,0);ctx.lineTo(x+30,0);ctx.lineTo(x+13,ground);ctx.lineTo(x-3,ground);ctx.fill();for(let j=0;j<4;j++)leaf(x+visual(-65,75,i*7+j),visual(20,225,i*11+j+3),visual(45,95,i*13+j+7),visual(-1.3,1.3,i*17+j+9),['#28724d','#3a8755','#61a35c'][j%3])}
// hanging vines
ctx.strokeStyle='#286344';ctx.lineWidth=4;for(let i=0;i<8;i++){let x=((i*173-world*.52)%1150+1150)%1150-80;ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+18,75,x-15,110,x+rand(-25,25),rand(160,230));ctx.stroke();leaf(x,95,24,.5,'#4e9850')}
// ground
let gg=ctx.createLinearGradient(0,ground,0,H);gg.addColorStop(0,'#6f9b4e');gg.addColorStop(.18,'#8eaa54');gg.addColorStop(1,'#b39958');ctx.fillStyle=gg;ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#477446';ctx.fillRect(0,ground,W,7);
for(let i=0;i<32;i++){let x=((i*53-world*.95)%1020+1020)%1020-30,y=ground+visual(20,105,i+89);ctx.fillStyle=i%2?'#69884a':'#d0b767';ctx.fillRect(x,y,visual(2,7,i+97),2)}for(let i=0;i<28;i++){let x=((i*71-world*.72)%1100+1100)%1100-50;leaf(x,ground+visual(8,28,i+103),visual(16,30,i+113),visual(-1,1,i+127),i%2?'#377448':'#4c8443')}
// foreground speed streaks
ctx.globalAlpha=.16;ctx.strokeStyle='#fff5cf';for(let i=0;i<9;i++){let x=((i*153-world*1.35)%1050+1050)%1050;ctx.beginPath();ctx.moveTo(x,ground+visual(10,80,i+131));ctx.lineTo(x+visual(24,60,i+139),ground+visual(10,80,i+149));ctx.stroke()}ctx.globalAlpha=1}
function drawGirl(){let x=player.x,y=player.y,sliding=player.slide>0,jumpY=ground-y;ctx.save();ctx.translate(x,y);if(sliding){ctx.rotate(-.05);ctx.translate(0,12)}else if(jumpY>0)ctx.translate(0,0);
// shadow
ctx.fillStyle='#24432e55';ctx.beginPath();ctx.ellipse(20,2+jumpY*.32,34-jumpY*.03,7,0,0,Math.PI*2);ctx.fill();
let run=Math.sin(player.frame)*8, bob=Math.abs(Math.sin(player.frame*2))*3;
if(sliding){ // gliding pose
ctx.strokeStyle='#b8734c';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-2,-24);ctx.lineTo(-27,-13);ctx.lineTo(-40,-10);ctx.moveTo(12,-23);ctx.lineTo(31,-12);ctx.lineTo(46,-8);ctx.stroke();ctx.fillStyle='#d89968';ctx.beginPath();ctx.ellipse(2,-28,26,12,-.06,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a94e32';ctx.beginPath();ctx.arc(25,-40,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0bd83';ctx.beginPath();ctx.arc(28,-41,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b14f31';ctx.beginPath();ctx.arc(26,-48,13,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#d66b3c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(34,-47);ctx.quadraticCurveTo(51,-45,42,-30);ctx.stroke();ctx.fillStyle='#497547';ctx.beginPath();ctx.moveTo(7,-24);ctx.lineTo(25,-23);ctx.lineTo(16,-12);ctx.closePath();ctx.fill();}
else{
// legs, alternating stride
ctx.strokeStyle='#ad704f';ctx.lineCap='round';ctx.lineWidth=9;let stride=run;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(-7+stride,-10);ctx.lineTo(-13+stride,-1);ctx.moveTo(8,-25);ctx.lineTo(15-stride,-11);ctx.lineTo(26-stride,-2);ctx.stroke();ctx.fillStyle='#e7ae7b';ctx.beginPath();ctx.ellipse(-16+stride,0,8,3,-.08,0,Math.PI*2);ctx.ellipse(29-stride,0,8,3,.08,0,Math.PI*2);ctx.fill();
// torso
ctx.fillStyle='#d59464';ctx.beginPath();ctx.moveTo(-10,-56);ctx.quadraticCurveTo(-13,-36,-3,-25);ctx.lineTo(12,-25);ctx.quadraticCurveTo(18,-42,10,-57);ctx.closePath();ctx.fill();
// arms swinging
ctx.strokeStyle='#cb895e';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-8,-51);ctx.lineTo(-18-run*.55,-39);ctx.lineTo(-15-run*.55,-31);ctx.moveTo(9,-51);ctx.lineTo(17+run*.55,-41);ctx.lineTo(15+run*.55,-33);ctx.stroke();
// leaf top and wrap skirt
ctx.fillStyle='#567f41';ctx.beginPath();ctx.moveTo(-10,-53);ctx.quadraticCurveTo(0,-58,11,-52);ctx.lineTo(8,-42);ctx.quadraticCurveTo(0,-47,-8,-42);ctx.closePath();ctx.fill();ctx.strokeStyle='#c3d66b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,-51);ctx.lineTo(7,-46);ctx.stroke();ctx.fillStyle='#648844';ctx.beginPath();ctx.moveTo(-4,-30);ctx.lineTo(13,-31);ctx.lineTo(20,-19);ctx.lineTo(5,-23);ctx.lineTo(-8,-18);ctx.closePath();ctx.fill();ctx.fillStyle='#8cae56';ctx.beginPath();ctx.moveTo(-1,-30);ctx.lineTo(7,-27);ctx.lineTo(2,-20);ctx.closePath();ctx.fill();
// head and hair
ctx.fillStyle='#e5ae7e';ctx.beginPath();ctx.arc(2,-68-bob,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b7472c';ctx.beginPath();ctx.arc(1,-73-bob,16,Math.PI,Math.PI*2);ctx.quadraticCurveTo(21,-72-bob,14,-58-bob);ctx.quadraticCurveTo(8,-59-bob,10,-67-bob);ctx.quadraticCurveTo(0,-61-bob,-12,-64-bob);ctx.quadraticCurveTo(-16,-76-bob,-7,-82-bob);ctx.closePath();ctx.fill();ctx.strokeStyle='#c95534';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(12,-73-bob);ctx.quadraticCurveTo(29,-67-bob,21,-53-bob);ctx.stroke();ctx.fillStyle='#fff0c8';ctx.beginPath();ctx.arc(7,-69-bob,2.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#533d32';ctx.beginPath();ctx.arc(7,-69-bob,1.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9d593c';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(8,-61-bob);ctx.quadraticCurveTo(11,-59-bob,14,-61-bob);ctx.stroke();}
ctx.restore()}
function drawMonkey(x,y,s,idx){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let run=Math.sin(elapsed*11+idx*2)*4;ctx.fillStyle='#493a32';ctx.beginPath();ctx.ellipse(0,-22,19,21,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#493a32';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,-21);ctx.lineTo(-22,-7+run);ctx.lineTo(-27,-5+run);ctx.moveTo(9,-20);ctx.lineTo(19,-8-run);ctx.lineTo(25,-8-run);ctx.moveTo(-8,-8);ctx.lineTo(-13,0+run);ctx.moveTo(8,-8);ctx.lineTo(14,0-run);ctx.stroke();ctx.strokeStyle='#6b5140';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(13,-30);ctx.bezierCurveTo(37,-38,30,-5,18,-8);ctx.stroke();ctx.fillStyle='#d29a6e';ctx.beginPath();ctx.ellipse(0,-29,13,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#493a32';ctx.beginPath();ctx.arc(0,-40,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4b98e';ctx.beginPath();ctx.ellipse(-11,-37,5,7,0,0,Math.PI*2);ctx.ellipse(11,-37,5,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0c4';ctx.beginPath();ctx.arc(-4,-40,2.7,0,Math.PI*2);ctx.arc(5,-40,2.7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#312923';ctx.beginPath();ctx.arc(-3,-40,1.3,0,Math.PI*2);ctx.arc(6,-40,1.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#57392d';ctx.beginPath();ctx.ellipse(1,-31,5,3,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawObstacle(o){if(o.type==='rock'){ctx.save();ctx.fillStyle='#49584a';ctx.beginPath();ctx.moveTo(o.x,ground);ctx.lineTo(o.x+4,ground-19);ctx.lineTo(o.x+o.w*.26,ground-o.h);ctx.lineTo(o.x+o.w*.52,ground-o.h+5);ctx.lineTo(o.x+o.w*.79,ground-o.h-2);ctx.lineTo(o.x+o.w,ground-17);ctx.lineTo(o.x+o.w,ground);ctx.closePath();ctx.fill();ctx.fillStyle='#758069';ctx.beginPath();ctx.moveTo(o.x+8,ground-16);ctx.lineTo(o.x+o.w*.31,ground-o.h+5);ctx.lineTo(o.x+o.w*.49,ground-o.h+13);ctx.lineTo(o.x+o.w*.29,ground-10);ctx.closePath();ctx.fill();ctx.strokeStyle='#b5aa7b';ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(o.x+o.w*.55,ground-o.h+11);ctx.lineTo(o.x+o.w*.8,ground-20);ctx.stroke();ctx.restore()}else if(o.type==='vine'){ctx.save();ctx.strokeStyle='#356c3d';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(o.x,0);ctx.bezierCurveTo(o.x+8,70,o.x+o.w*.8,80,o.x+o.w*.72,ground-102);ctx.stroke();ctx.strokeStyle='#548441';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x+12,0);ctx.quadraticCurveTo(o.x+18,50,o.x+o.w*.72,ground-102);ctx.stroke();for(let i=0;i<4;i++)leaf(o.x+o.w*.7+Math.sin(i)*4,ground-125+i*12,20,.8+i*.2,i%2?'#578745':'#69964d');ctx.restore()}else{ctx.save();ctx.translate(o.x+10,o.y+Math.sin(elapsed*5+o.x)*3);ctx.fillStyle='#ffe486';ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dd8d44';ctx.beginPath();ctx.arc(-2,-2,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4c4';ctx.beginPath();ctx.arc(-3,-4,2,0,Math.PI*2);ctx.fill();ctx.restore()}}
function draw(){drawBackground();for(const m of monkeys)drawMonkey(m.x,m.y,1,m.s*2);for(const o of objects)drawObstacle(o);drawGirl();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(state==='running'&&elapsed<4){ctx.fillStyle='#103a2d';ctx.globalAlpha=Math.max(0,1-elapsed/4);rounded(383,462,194,39,20,'#143e31c9');ctx.globalAlpha=Math.max(0,1-elapsed/4);ctx.fillStyle='#f5f0d7';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText('SWIPE TO DODGE!',480,487);ctx.globalAlpha=1}}
function pointerStart(e){canvas.setPointerCapture?.(e.pointerId);canvas.dataset.sx=e.clientX;canvas.dataset.sy=e.clientY}function pointerEnd(e){if(canvas.dataset.sy===undefined)return;let dx=e.clientX-Number(canvas.dataset.sx),dy=e.clientY-Number(canvas.dataset.sy);delete canvas.dataset.sy;if(Math.abs(dy)>22||Math.abs(dx)>50){if(Math.abs(dy)>Math.abs(dx))action(dy<0?'jump':'slide');return}if(state==='ready'||state==='over')reset();else if(e.clientY<innerHeight*.45)action('jump');else action('slide')}
canvas.addEventListener('pointerdown',pointerStart);canvas.addEventListener('pointerup',pointerEnd);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' ','w','s'].includes(e.key)){e.preventDefault();if(state!=='running'){reset();return}action(e.key==='ArrowDown'||e.key==='s'?'slide':'jump')}if(e.key==='Enter'&&state!=='running')reset()});document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();action('jump')});document.querySelector('#slide').addEventListener('pointerdown',e=>{e.preventDefault();action('slide')});startBtn.addEventListener('click',reset);overlay.addEventListener('click',e=>{if(e.target===overlay)reset()});soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♪ Sound on':'♪ Sound off';if(soundOn)playTone(500,.08)});
// Initial animated scene, with no active hazards so the title screen is lively.
objects=[];for(let i=0;i<4;i++)addBerries();draw();
})();
